[project]
name = "hpc-gantt-bot"
version = "0.1.0"
description = "Draws the team's HPC usage plan as a Gantt chart and uploads it to Dropbox"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cyclopts",
    "matplotlib",
    "openpyxl",
    "requests",
]

[dependency-groups]
dev = [
    "deptry",
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
# A script and its tests, not an installable package
package = false

# Lint settings copied from qcore, for ucgmsim/meta-ci-action
[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Ignore docstring errors in tests folder
"tests/**.py" = ["D"]

[tool.npdlint]
# Docstring linting covers the script; tests are exempt (see ruff's "D" ignore).
include = ["hpc_gantt.py"]

[tool.numpydoc_validation]
checks = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]
