name: CI

on:
  pull_request:
  push:
    branches: [main]

# The shared CI needs only to read the repo. Without this, its third-party actions would get the org's default
# token, which can push to main and start the chart workflow, whose job holds the secrets.
permissions:
  contents: read

jobs:
  ci:
    uses: ucgmsim/meta-ci-action/.github/workflows/ci.yml@v2
    with:
      python-version: "3.14"
